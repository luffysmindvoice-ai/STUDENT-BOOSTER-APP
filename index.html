<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Booster App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      font-weight: bold;
    }
    .step {
      display: none;
    }
    .active {
      display: block;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .question-card {
      background: #f9f9f9;
      padding: 15px;
      border-left: 4px solid #007bff;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .options label {
      font-weight: normal;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Step 1: App Header & Grade Selection -->
  <div id="step-1" class="step active">
    <h1>STUDENT GRADE BOOSTER APP</h1>
    <label for="grade">Select Your Grade:</label>
    <select id="grade">
      <option value="5">Grade 5</option>
      <option value="6">Grade 6</option>
      <option value="7">Grade 7</option>
      <option value="8">Grade 8</option>
      <option value="9">Grade 9</option>
      <option value="10">Grade 10</option>
      <option value="11">Grade 11</option>
      <option value="12">Grade 12</option>
    </select>
    <button onclick="nextStep(2)">Next</button>
  </div>

  <!-- Step 2: Strengths & Weaknesses -->
  <div id="step-2" class="step">
    <h2>Academic Profile</h2>
    <label for="strengths">What are your Strengths?</label>
    <input type="text" id="strengths" placeholder="e.g. Science, Algebra">

    <label for="weaknesses">What are your Weaknesses?</label>
    <input type="text" id="weaknesses" placeholder="e.g. Geometry, History">

    <button onclick="nextStep(3)">Next</button>
  </div>

  <!-- Step 3: Performance Category -->
  <div id="step-3" class="step">
    <h2>Performance Level</h2>
    <label for="performance">Select your current performance category:</label>
    <select id="performance">
      <option value="Topper">Topper</option>
      <option value="Average">Average</option>
      <option value="Below Average">Below Average</option>
    </select>
    <button onclick="nextStep(4)">Next</button>
  </div>

  <!-- Step 4: Difficulty Selection -->
  <div id="step-4" class="step">
    <h2>Quiz Settings</h2>
    <label for="difficulty">Choose Difficulty Level:</label>
    <select id="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- Step 5: Quiz Section -->
  <div id="step-5" class="step">
    <h2 id="quiz-title">Practice Questions</h2>
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="button" onclick="generateNextBatch()">Submit & Load Next 10 Questions</button>
    </form>
  </div>
</div>

<script>
  let currentBatch = 1;

  function nextStep(stepNumber) {
    document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
    document.getElementById(`step-${stepNumber}`).classList.add('active');
  }

  function startQuiz() {
    currentBatch = 1;
    nextStep(5);
    generateQuestions();
  }

  function generateQuestions() {
    const grade = document.getElementById('grade').value;
    const difficulty = document.getElementById('difficulty').value;
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    for (let i = 1; i <= 10; i++) {
      const qIndex = (currentBatch - 1) * 10 + i;
      const questionHtml = `
        <div class="question-card">
          <p><strong>Q${qIndex} (Grade ${grade} - ${difficulty}):</strong> What is question number ${qIndex} for your level?</p>
          <div class="options">
            <label><input type="radio" name="q${qIndex}" value="A"> Option A</label><br>
            <label><input type="radio" name="q${qIndex}" value="B"> Option B</label><br>
            <label><input type="radio" name="q${qIndex}" value="C"> Option C</label><br>
            <label><input type="radio" name="q${qIndex}" value="D"> Option D</label>
          </div>
        </div>
      `;
      container.innerHTML += questionHtml;
    }
  }

  function generateNextBatch() {
    currentBatch++;
    generateQuestions();
    window.scrollTo(0, 0);
  }
</script>

</body>
  </html>
