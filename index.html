<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Booster App</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }
    h1 {
      color: #38bdf8;
      text-align: center;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      margin: 8px 0;
      width: 100%;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Booster App</h1>
    <div id="quiz-container">
      <p id="question-text">Loading question...</p>
      <div id="options-container"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "1. What is the SI unit of electric current?",
        options: ["Ampere", "Volt", "Ohm", "Watt"],
        answer: 0
      },
      {
        question: "2. Which acid is present in lemon?",
        options: ["Acetic acid", "Citric acid", "Tartaric acid", "Lactic acid"],
        answer: 1
      }
    ];

    let currentIdx = 0;

    function loadQuestion() {
      const q = questions[currentIdx];
      document.getElementById("question-text").innerText = q.question;
      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";
      
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      if (selected === questions[currentIdx].answer) {
        alert("Correct!");
      } else {
        alert("Incorrect. Try again!");
      }
      currentIdx = (currentIdx + 1) % questions.length;
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
